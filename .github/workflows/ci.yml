name: CodeCal quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unix:
    name: Test ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
          - platform: macos
            arch: x64
            runner: macos-15-intel
          - platform: macos
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:release
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: npm run build
  windows:
    # Server 2025 can leave WebView2 automation waiting for its DevTools port.
    # https://github.com/actions/runner-images/issues/14738
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:release
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: npm run build
      - run: npm run tauri build
      - name: Ensure WebView2 Runtime for native E2E
        shell: pwsh
        run: |
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtimeVersion = Get-ItemProperty -Path $runtimeKeys -Name pv -ErrorAction SilentlyContinue | Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' } | Select-Object -First 1 -ExpandProperty pv
          if (!$runtimeVersion) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $installation = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            if ($installation.ExitCode -ne 0) { throw "WebView2 installation failed: $($installation.ExitCode)" }
            $runtimeVersion = Get-ItemProperty -Path $runtimeKeys -Name pv -ErrorAction SilentlyContinue | Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' } | Select-Object -First 1 -ExpandProperty pv
          }
          if (!$runtimeVersion) { throw 'WebView2 Runtime is not installed' }
          Write-Output "WebView2 Runtime: $runtimeVersion"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: CodeCal-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
