name: CodeCal quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unix:
    name: Test ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
          - platform: macos
            arch: x64
            runner: macos-15-intel
          - platform: macos
            arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:release
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: npm run build
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:release
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: npm run build
      - run: npm run tauri build
      - name: Ensure WebView2 Runtime for native E2E
        shell: pwsh
        run: |
          $runtimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $runtimeVersion = Get-ItemProperty -Path $runtimeKeys -Name pv -ErrorAction SilentlyContinue | Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' } | Select-Object -First 1 -ExpandProperty pv
          if (!$runtimeVersion) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $installation = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            if ($installation.ExitCode -ne 0) { throw "WebView2 installation failed: $($installation.ExitCode)" }
            $runtimeVersion = Get-ItemProperty -Path $runtimeKeys -Name pv -ErrorAction SilentlyContinue | Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' } | Select-Object -First 1 -ExpandProperty pv
          }
          if (!$runtimeVersion) { throw 'WebView2 Runtime is not installed' }
          Write-Output "WebView2 Runtime: $runtimeVersion"
      - name: Configure WebView2 debugging for elevated E2E
        shell: pwsh
        run: |
          # Runtime 150+ ignores WEBVIEW2_* and HKCU overrides in elevated hosts.
          # https://github.com/MicrosoftEdge/WebView2Feedback/issues/5645
          $policy = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name 'codecal.exe' -Value '--remote-debugging-port=9223' -PropertyType String -Force | Out-Null
      - run: npm run test:e2e
      - name: Remove E2E debugging policy
        if: always()
        shell: pwsh
        run: |
          $policy = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          if (Test-Path $policy) {
            Remove-ItemProperty -Path $policy -Name 'codecal.exe' -ErrorAction SilentlyContinue
          }
      - name: Upload native E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: CodeCal-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
