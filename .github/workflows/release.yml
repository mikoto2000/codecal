name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - name: Validate tag and prepare six build targets
        id: plan
        run: node scripts/release.mjs plan
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies from public npm
        run: npm ci --registry=https://registry.npmjs.org/
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:release

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build and bundle dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev librsvg2-dev patchelf libfuse2
      - name: Apply tag version to npm, Cargo and Tauri
        run: node scripts/release.mjs version
      - name: Install pinned npm
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies from public npm
        run: npm ci --registry=https://registry.npmjs.org/
      - name: Test native Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --target ${{ matrix.target }}
      - name: Build native installer bundles
        id: bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && '-' || '' }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
          includeUpdaterJson: false
      - name: Validate and name release assets
        run: node scripts/release.mjs collect
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_ARTIFACT_PATHS: ${{ steps.bundle.outputs.artifactPaths }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: .release/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: .release
          merge-multiple: true
      - name: Require all six platforms and generate checksums
        run: node scripts/release.mjs verify
      - name: Upload assets to a draft, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-draft.txt; then
            if [[ "$(cat release-draft.txt)" != "true" ]]; then
              echo "::error::This release is already published. Use a new version tag instead of replacing published assets."
              exit 1
            fi
          else
            release_args=(--draft --verify-tag --generate-notes --title "CodeCal $RELEASE_TAG")
            if [[ "$PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" .release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
