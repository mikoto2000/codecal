[package]
name = "codecal"
version = "1.0.0"
edition = "2021"
default-run = "codecal"

[lib]
name = "codecal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-window-state"]
human-benchmark = []

[[example]]
name = "human_worker_benchmark"
required-features = ["human-benchmark"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-window-state = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
walkdir = "2"
notify = "8"
rayon = "1"

tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

